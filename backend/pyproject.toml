[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "e2b-code-interpreter>=1.0.4",
    "python-dotenv>=1.0.1",
    "anthropic>=0.40.0",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "google-genai>=2.18.1",
    "sqlalchemy>=2.0.0",
    "pgvector>=0.3.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "neo4j>=5.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
