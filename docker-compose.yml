version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kint-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kintpassword}
      POSTGRES_DB: ${POSTGRES_DB:-kint_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kint_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kint} -d ${POSTGRES_DB:-kint_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    container_name: kint-neo4j
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4jpassword}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - kint_neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kint_pgdata:
    driver: local
  kint_neo4jdata:
    driver: local

